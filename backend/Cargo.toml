[package]
name = "accuenergy-metering"
version = "0.1.0"
description = "Accuenergy Metering — Acuvim IIW Modbus RTU data collection and reporting"
authors = ["Syed Hassaan Shah"]
edition = "2021"

[lib]
name = "accuenergy_metering_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# Phase 2: serialport + tokio-modbus for real RS485 I/O
# serialport = "4"
# tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# tokio-modbus = { version = "0.16", default-features = false, features = ["rtu", "rtu-sync"] }
# rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
